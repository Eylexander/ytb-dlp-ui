name: CI

on:
  pull_request:
  push:
    # main is covered by docker-publish.yml, which runs this workflow before publishing.
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real PostgreSQL so the datastore round-trip test runs instead of skipping.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ytdlp
          POSTGRES_PASSWORD: ytdlp
          POSTGRES_DB: ytdlp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ytdlp -d ytdlp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ytdlp:ytdlp@localhost:5432/ytdlp?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check translations
        run: npm run check:i18n

      - name: Build
        run: npm run build
